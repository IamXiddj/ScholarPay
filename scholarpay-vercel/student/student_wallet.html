<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Wallet — ScholarPay</title>
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh"><div class="spinner"></div></div></div>
<script type="module">
import { requireLogin, getUser, saveAuth, getToken, apiFetch, isValidStellarAddress, showFlash } from '/assets/js/app.js';
import { pageShell } from '/assets/js/layout.js';

if (!requireLogin()) throw new Error('redirect');

let currentUser = getUser();

function render() {
  const hasWallet = !!currentUser.stellar_address;

  const walletDisplay = hasWallet
    ? `<div style="text-align:center;padding:16px 0">
        <div style="width:56px;height:56px;background:var(--accent-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
          <i class="ti ti-wallet" style="font-size:26px;color:var(--accent)"></i>
        </div>
        <span class="badge badge-success" style="margin-bottom:10px"><i class="ti ti-check"></i> Linked</span>
        <div style="font-family:var(--mono);font-size:12px;color:var(--text-muted);background:var(--bg);padding:10px 14px;border-radius:var(--radius);word-break:break-all;margin:10px 0">
          ${currentUser.stellar_address}
        </div>
        <button class="btn btn-sm btn-outline" onclick="copyWallet()">
          <i class="ti ti-copy"></i> Copy address
        </button>
        <div style="margin-top:12px">
          <a href="https://stellar.expert/explorer/testnet/account/${currentUser.stellar_address}"
             target="_blank" class="btn btn-sm btn-outline">
            <i class="ti ti-external-link"></i> View on Explorer
          </a>
        </div>
       </div>`
    : `<div class="empty-state">
        <div class="empty-icon"><i class="ti ti-wallet"></i></div>
        <p>No wallet linked yet. Submit your Stellar address on the right.</p>
       </div>`;

  document.getElementById('app').innerHTML = pageShell('student', 'wallet', `
    <div class="page-header">
      <h1 class="page-title">My Wallet</h1>
      <p class="page-subtitle">Link your Stellar wallet to receive scholarship disbursements.</p>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">

      <div class="card">
        <div class="card-header"><span class="card-title">Current Stellar Wallet</span></div>
        ${walletDisplay}
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">Update Wallet Address</span></div>
        <div class="form-group">
          <label class="form-label">Stellar Public Key <span class="required">*</span></label>
          <input type="text" id="stellar-input" class="form-control mono"
                 value="${currentUser.stellar_address || ''}"
                 placeholder="GBSZ..."
                 oninput="validateInput(this)">
          <div class="form-hint" id="wallet-hint">56-character address starting with G</div>
        </div>
        <div class="alert alert-info" style="font-size:12.5px">
          <i class="ti ti-info-circle"></i>
          <div>Make sure your wallet has a <strong>USDC trustline</strong> set up on Stellar, otherwise disbursements will fail.</div>
        </div>
        <button class="btn btn-primary" id="save-btn" onclick="saveWallet()">
          <i class="ti ti-check"></i> Save Wallet Address
        </button>
      </div>

    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-header"><span class="card-title">Setting up your Stellar wallet</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-top:4px">
        <div>
          <div style="font-weight:500;font-size:13.5px;margin-bottom:8px">
            <i class="ti ti-brand-chrome" style="color:var(--accent)"></i> Freighter (Browser Extension)
          </div>
          <ol style="font-size:13px;color:var(--text-muted);padding-left:18px;line-height:2">
            <li>Install from <a href="https://freighter.app" target="_blank">freighter.app</a></li>
            <li>Create a new wallet and save your seed phrase</li>
            <li>Switch to <strong>Testnet</strong> in Settings</li>
            <li>Add USDC trustline via the Assets tab</li>
            <li>Copy your public key and paste it above</li>
          </ol>
        </div>
        <div>
          <div style="font-weight:500;font-size:13.5px;margin-bottom:8px">
            <i class="ti ti-device-mobile" style="color:var(--success)"></i> LOBSTR (Mobile App)
          </div>
          <ol style="font-size:13px;color:var(--text-muted);padding-left:18px;line-height:2">
            <li>Download from <a href="https://lobstr.co" target="_blank">lobstr.co</a></li>
            <li>Create an account and secure your keys</li>
            <li>Search for USDC and add it as an asset</li>
            <li>Go to Settings → Wallet address</li>
            <li>Copy your Stellar address and paste it above</li>
          </ol>
        </div>
      </div>
      <div style="margin-top:16px;padding:12px;background:var(--bg);border-radius:var(--radius);font-size:12.5px">
        <strong>Testnet USDC Issuer:</strong>
        <span style="font-family:var(--mono);font-size:11.5px;color:var(--text-muted);margin-left:8px">
          GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
        </span>
        <button class="btn btn-sm btn-outline" style="margin-left:8px;padding:2px 8px"
          onclick="navigator.clipboard.writeText('GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5').then(()=>showFlash('Copied!'))">
          <i class="ti ti-copy"></i>
        </button>
      </div>
    </div>
  `);
}

window.validateInput = (el) => {
  const hint = document.getElementById('wallet-hint');
  const val = el.value.trim();
  if (!val) { hint.textContent = '56-character address starting with G'; hint.style.color = ''; return; }
  if (isValidStellarAddress(val)) {
    hint.innerHTML = '<span style="color:var(--success)"><i class="ti ti-check"></i> Valid Stellar address</span>';
  } else {
    hint.innerHTML = '<span style="color:var(--danger)"><i class="ti ti-alert-circle"></i> Must start with G and be 56 characters</span>';
  }
};

window.copyWallet = () => {
  if (!currentUser.stellar_address) return;
  navigator.clipboard.writeText(currentUser.stellar_address).then(() => showFlash('Address copied!'));
};

window.saveWallet = async () => {
  const stellar_address = document.getElementById('stellar-input')?.value?.trim();
  if (!isValidStellarAddress(stellar_address))
    return showFlash('Invalid Stellar address. Must start with G and be 56 characters.', 'danger');

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Saving…';

  try {
    await apiFetch('/students', { method: 'PATCH', body: { stellar_address } });

    // Update local user data
    currentUser = { ...currentUser, stellar_address };
    saveAuth(getToken(), currentUser);

    showFlash('Wallet address saved successfully!');
    render();
  } catch(e) {
    showFlash(e.message, 'danger');
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-check"></i> Save Wallet Address';
  }
};

render();
</script>
</body>
</html>
