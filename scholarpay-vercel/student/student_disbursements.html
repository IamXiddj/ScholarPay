<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Disbursements — ScholarPay</title>
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh"><div class="spinner"></div></div></div>
<script type="module">
import { requireLogin, apiFetch, formatUSDC, formatDateTime, statusBadge, txHashChip, showFlash } from '/assets/js/app.js';
import { pageShell } from '/assets/js/layout.js';

if (!requireLogin()) throw new Error('redirect');

let page = 1;
let total = 0;
const perPage = 15;

async function load() {
  const result = await apiFetch(`/disbursements?page=${page}`);
  total = result.total || 0;
  render(result.data || []);
}

function render(data) {
  const totalPages = Math.ceil(total / perPage);
  const totalReceived = data
    .filter(d => d.status === 'confirmed')
    .reduce((sum, d) => sum + d.amount, 0);

  const rows = data.map(d => `
    <tr>
      <td style="font-size:12.5px;white-space:nowrap">${formatDateTime(d.disbursed_at)}</td>
      <td style="font-size:13px">${d.scholarship?.name || '—'}</td>
      <td style="font-weight:600;color:var(--success)">+${formatUSDC(d.amount)}</td>
      <td><span class="badge badge-neutral">${d.purpose}</span></td>
      <td>${txHashChip(d.stellar_tx_hash)}</td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--text-muted)">
        ${d.ledger_sequence ? '#' + d.ledger_sequence.toLocaleString() : '—'}
      </td>
      <td>${statusBadge(d.status)}</td>
    </tr>
  `).join('');

  const pagination = totalPages > 1
    ? `<div style="display:flex;justify-content:center;gap:8px;padding:16px 0 4px">
        ${Array.from({length: totalPages}, (_, i) => i + 1)
          .map(i => `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-outline'}" onclick="goPage(${i})">${i}</button>`)
          .join('')}
       </div>`
    : '';

  document.getElementById('app').innerHTML = pageShell('student', 'disbursements', `
    <div class="page-header">
      <h1 class="page-title">My Disbursements</h1>
      <p class="page-subtitle">Full history of scholarship payments to your Stellar wallet.</p>
    </div>

    <div class="stats-grid" style="margin-bottom:20px">
      <div class="stat-card">
        <div class="stat-label">Total received (this page)</div>
        <div class="stat-value usdc">${formatUSDC(totalReceived)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total payments</div>
        <div class="stat-value">${total}</div>
      </div>
    </div>

    <div class="card">
      ${data.length === 0
        ? `<div class="empty-state">
            <div class="empty-icon"><i class="ti ti-cash"></i></div>
            <p>No disbursements yet. Your payments will appear here once an admin disburses a scholarship to you.</p>
           </div>`
        : `<div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Scholarship</th>
                  <th>Amount (USDC)</th>
                  <th>Purpose</th>
                  <th>Transaction</th>
                  <th>Ledger</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
           </div>
           ${pagination}`}
    </div>
  `);
}

window.goPage = (p) => { page = p; load(); };

load().catch(e => showFlash(e.message, 'danger'));
</script>
</body>
</html>
