<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScholarPay — Sign In</title>
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-wrap{width:100%;max-width:440px;padding:24px}
.login-brand{text-align:center;margin-bottom:32px}
.login-brand-icon{width:52px;height:52px;background:var(--stellar);border-radius:14px;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;font-weight:700;margin:0 auto 12px}
.login-brand h1{font-size:22px;font-weight:600;letter-spacing:-.4px}
.login-brand p{font-size:13.5px;color:var(--text-muted);margin-top:4px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:var(--shadow-md)}
.login-card h2{font-size:16px;font-weight:600;margin-bottom:20px}
.demo-accounts{margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.demo-accounts p{font-size:11px;color:var(--text-hint);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.demo-btn{display:flex;align-items:center;gap:10px;width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;font-family:var(--font);font-size:13px;color:var(--text);margin-bottom:8px;transition:background .12s;text-align:left}
.demo-btn:hover{background:var(--accent-bg);border-color:var(--accent-dim)}
.stellar-features{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feature-chip{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:12px}
.feature-chip .icon{font-size:18px;margin-bottom:4px;color:var(--accent)}
.feature-chip strong{display:block;font-weight:500;font-size:12.5px}
.feature-chip span{color:var(--text-muted)}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-brand">
    <div class="login-brand-icon">S</div>
    <h1>ScholarPay</h1>
    <p>On-chain scholarship disbursement on Stellar</p>
  </div>

  <div class="login-card">
    <h2>Sign in to your account</h2>
    <div id="error-msg" class="alert alert-danger" style="display:none"></div>

    <div class="form-group">
      <label class="form-label">Email address</label>
      <input type="email" id="email" class="form-control" placeholder="you@example.com" autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••">
    </div>
    <button id="login-btn" class="btn btn-primary btn-lg" style="width:100%;margin-top:4px" onclick="doLogin()">
      <i class="ti ti-login"></i> Sign In
    </button>

    <div class="demo-accounts">
      <p>Demo accounts (password: <code style="background:var(--bg);padding:1px 5px;border-radius:4px">Student@123</code>)</p>
      <button class="demo-btn" onclick="fill('admin@scholarpay.org','Student@123')">
        <i class="ti ti-shield-check" style="font-size:18px;color:var(--accent)"></i>
        <div style="flex:1"><strong style="font-size:13px">Admin User</strong><div style="font-size:11.5px;color:var(--text-muted)">admin@scholarpay.org</div></div>
        <span class="badge badge-info" style="font-size:10px">Admin</span>
      </button>
      <button class="demo-btn" onclick="fill('student@scholarpay.org','Student@123')">
        <i class="ti ti-user-graduate" style="font-size:18px;color:var(--success)"></i>
        <div style="flex:1"><strong style="font-size:13px">Maria Santos</strong><div style="font-size:11.5px;color:var(--text-muted)">student@scholarpay.org</div></div>
        <span class="badge badge-success" style="font-size:10px">Student</span>
      </button>
    </div>
  </div>

  <div class="stellar-features">
    <div class="feature-chip"><div class="icon"><i class="ti ti-bolt"></i></div><strong>3–5 sec finality</strong><span>Stellar Testnet</span></div>
    <div class="feature-chip"><div class="icon"><i class="ti ti-currency-dollar"></i></div><strong>USDC payments</strong><span>SEP-41 token</span></div>
    <div class="feature-chip"><div class="icon"><i class="ti ti-lock"></i></div><strong>Audit trail</strong><span>On-chain immutable</span></div>
    <div class="feature-chip"><div class="icon"><i class="ti ti-world"></i></div><strong>Global access</strong><span>No bank needed</span></div>
  </div>
</div>

<script type="module">
  import { saveAuth, isLoggedIn, isAdmin } from '/assets/js/app.js';

  // Already logged in? Redirect
  if (isLoggedIn()) {
    window.location.href = isAdmin() ? '/admin/dashboard' : '/student/dashboard';
  }

  window.fill = (email, pass) => {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
  };

  window.doLogin = async () => {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('login-btn');
    const errEl    = document.getElementById('error-msg');
    errEl.style.display = 'none';

    if (!email || !password) {
      errEl.textContent = 'Please enter your email and password.';
      errEl.style.display = 'flex'; return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      saveAuth(data.token, data.user);
      window.location.href = data.user.role === 'admin' ? '/admin/dashboard' : '/student/dashboard';
    } catch (e) {
      errEl.innerHTML = `<i class="ti ti-alert-circle"></i> ${e.message}`;
      errEl.style.display = 'flex';
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-login"></i> Sign In';
    }
  };

  // Enter key support
  document.addEventListener('keydown', e => { if (e.key === 'Enter') window.doLogin(); });
</script>
</body>
</html>
