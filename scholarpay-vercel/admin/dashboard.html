<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — ScholarPay</title>
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh">
    <div class="spinner"></div>
  </div>
</div>
<script type="module">
import { requireAdminPage, apiFetch, formatUSDC, formatDate, statusBadge, txHashChip, stellarChip, showFlash } from '/assets/js/app.js';
import { pageShell } from '/assets/js/layout.js';

if (!requireAdminPage()) throw new Error('redirect');

async function render() {
  const stats = await apiFetch('/stats');
  const [scholarships] = await Promise.all([apiFetch('/scholarships')]);

  const activeSchs = scholarships.filter(s => s.status === 'active').slice(0,5);

  const schListHtml = activeSchs.length === 0
    ? `<div class="empty-state"><div class="empty-icon"><i class="ti ti-award"></i></div><p>No active scholarships yet.</p><a href="/admin/scholarships" class="btn btn-sm btn-primary" style="margin-top:10px">Create one</a></div>`
    : activeSchs.map(s => {
        const pct = s.total_amount > 0 ? Math.round(((s.total_amount - s.remaining_amount) / s.total_amount) * 100) : 0;
        return `<div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div><div style="font-weight:500;font-size:13.5px">${s.name}</div>
            <div style="font-size:12px;color:var(--text-muted)">${s.disbursement_count||0} disbursements</div></div>
            <div style="text-align:right"><div style="font-weight:600;font-size:13.5px">${formatUSDC(s.remaining_amount)} USDC</div>
            <div style="font-size:11px;color:var(--text-hint)">remaining</div></div>
          </div>
          <div style="margin-top:6px;background:var(--bg);border-radius:4px;height:4px;overflow:hidden">
            <div style="height:4px;background:var(--accent);border-radius:4px;width:${pct}%"></div>
          </div>
          <div style="font-size:11px;color:var(--text-hint);margin-top:2px">${pct}% disbursed</div>
        </div>`;
      }).join('');

  const recentHtml = (stats.recentDisbursements||[]).length === 0
    ? `<div class="empty-state"><div class="empty-icon"><i class="ti ti-send"></i></div><p>No disbursements yet.</p></div>`
    : `<div class="table-wrap"><table>
        <thead><tr><th>Student</th><th>Scholarship</th><th>Amount</th><th>Purpose</th><th>Tx Hash</th><th>Status</th><th>Date</th></tr></thead>
        <tbody>${(stats.recentDisbursements).map(d => `<tr>
          <td><strong style="font-size:13px">${d.student?.name||'—'}</strong><br>${stellarChip(d.student?.stellar_address,false)}</td>
          <td style="font-size:12.5px">${d.scholarship?.name||'—'}</td>
          <td style="font-weight:600">${formatUSDC(d.amount)}</td>
          <td><span class="badge badge-neutral">${d.purpose}</span></td>
          <td>${txHashChip(d.stellar_tx_hash)}</td>
          <td>${statusBadge(d.status)}</td>
          <td style="font-size:12px;color:var(--text-muted)">${formatDate(d.disbursed_at)}</td>
        </tr>`).join('')}</tbody>
       </table></div>`;

  document.getElementById('app').innerHTML = pageShell('admin','dashboard', `
    <div class="page-header">
      <h1 class="page-title">Dashboard</h1>
      <p class="page-subtitle">Welcome back. Here's your ScholarPay overview.</p>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label"><i class="ti ti-award"></i> Active Scholarships</div>
        <div class="stat-value">${stats.activeScholarships}</div><div class="stat-sub">${stats.totalScholarships} total</div></div>
      <div class="stat-card"><div class="stat-label"><i class="ti ti-send"></i> Total Disbursed</div>
        <div class="stat-value usdc">${formatUSDC(stats.totalDisbursed)}</div><div class="stat-sub">Confirmed on Stellar</div></div>
      <div class="stat-card"><div class="stat-label"><i class="ti ti-users"></i> Students</div>
        <div class="stat-value">${stats.totalStudents}</div><div class="stat-sub">Registered recipients</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
      <div class="card">
        <div class="card-header"><span class="card-title">Quick Actions</span></div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <a href="/admin/disburse" class="btn btn-primary"><i class="ti ti-send"></i> Disburse Scholarship</a>
          <a href="/admin/scholarships" class="btn btn-outline"><i class="ti ti-plus"></i> Create Scholarship</a>
          <a href="/admin/students" class="btn btn-outline"><i class="ti ti-user-plus"></i> Add Student</a>
          <a href="/admin/audit" class="btn btn-outline"><i class="ti ti-list-search"></i> View Audit Log</a>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Active Scholarships</span>
          <a href="/admin/scholarships" class="btn btn-sm btn-outline">View all</a></div>
        ${schListHtml}
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Recent Disbursements</span>
        <a href="/admin/audit" class="btn btn-sm btn-outline">Full audit log</a></div>
      ${recentHtml}
    </div>
  `);
}

render().catch(e => showFlash(e.message, 'danger'));
</script>
</body>
</html>
