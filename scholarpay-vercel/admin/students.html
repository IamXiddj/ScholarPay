<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Students — ScholarPay</title>
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh"><div class="spinner"></div></div></div>
<script type="module">
import { requireAdminPage, apiFetch, formatUSDC, formatDate, stellarChip, isValidStellarAddress, showFlash } from '/assets/js/app.js';
import { pageShell } from '/assets/js/layout.js';

if (!requireAdminPage()) throw new Error('redirect');

let students = [];

async function load() {
  students = await apiFetch('/students');
  render();
}

function render(showForm = false) {
  const rows = students.map(s => `<tr>
    <td style="font-weight:500">${s.name}</td>
    <td style="font-size:12.5px;color:var(--text-muted)">${s.email}</td>
    <td>${stellarChip(s.stellar_address, true)}</td>
    <td style="font-size:12.5px;color:var(--text-muted)">${s.institution||'—'}</td>
    <td style="font-size:12px;color:var(--text-muted)">${formatDate(s.created_at)}</td>
    <td>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm btn-outline" onclick="openWallet(${s.id},'${s.stellar_address||''}','${s.name.replace(/'/g,"\\'")}')">
          <i class="ti ti-wallet"></i> Wallet
        </button>
        <a href="/admin/disburse" class="btn btn-sm btn-primary"><i class="ti ti-send"></i></a>
      </div>
    </td>
  </tr>`).join('');

  document.getElementById('app').innerHTML = pageShell('admin','students', `
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end">
      <div><h1 class="page-title">Students</h1><p class="page-subtitle">Manage scholarship recipients and their Stellar wallets.</p></div>
      <button class="btn btn-primary" onclick="toggleForm()"><i class="ti ti-user-plus"></i> Add Student</button>
    </div>

    <div id="add-form" style="display:${showForm?'block':'none'};margin-bottom:24px">
      <div class="card">
        <div class="card-header"><span class="card-title">Add New Student</span>
          <button class="btn btn-sm btn-outline" onclick="toggleForm()"><i class="ti ti-x"></i></button></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Full Name <span class="required">*</span></label>
            <input type="text" id="s-name" class="form-control" placeholder="e.g. Maria Santos"></div>
          <div class="form-group"><label class="form-label">Email <span class="required">*</span></label>
            <input type="email" id="s-email" class="form-control" placeholder="student@example.com"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Password <span class="required">*</span></label>
            <input type="password" id="s-pass" class="form-control" placeholder="Temporary password"></div>
          <div class="form-group"><label class="form-label">Institution</label>
            <input type="text" id="s-inst" class="form-control" placeholder="e.g. University of Manila"></div>
        </div>
        <div class="form-group"><label class="form-label">Stellar Wallet Address</label>
          <input type="text" id="s-stellar" class="form-control mono" placeholder="GBSZ..." oninput="validateWalletInput(this)">
          <div class="form-hint" id="s-wallet-hint">56-character Stellar public key starting with G</div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn btn-outline" onclick="toggleForm()">Cancel</button>
          <button class="btn btn-primary" onclick="addStudent()"><i class="ti ti-check"></i> Add Student</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">All Students (${students.length})</span></div>
      ${students.length === 0
        ? `<div class="empty-state"><div class="empty-icon"><i class="ti ti-users"></i></div><p>No students yet.</p></div>`
        : `<div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Email</th><th>Stellar Wallet</th><th>Institution</th><th>Joined</th><th>Actions</th></tr></thead>
            <tbody>${rows}</tbody></table></div>`}
    </div>

    <!-- Wallet Modal -->
    <div id="wallet-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center">
      <div class="card" style="width:100%;max-width:480px;margin:24px">
        <div class="card-header"><span class="card-title">Update Wallet — <span id="modal-name"></span></span>
          <button class="btn btn-sm btn-outline" onclick="closeWallet()"><i class="ti ti-x"></i></button></div>
        <div class="form-group">
          <label class="form-label">Stellar Address <span class="required">*</span></label>
          <input type="text" id="modal-addr" class="form-control mono" placeholder="GBSZ..." oninput="validateWalletInput(this)">
          <div class="form-hint">Public key starting with G, 56 characters.</div>
        </div>
        <input type="hidden" id="modal-id">
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn btn-outline" onclick="closeWallet()">Cancel</button>
          <button class="btn btn-primary" onclick="saveWallet()"><i class="ti ti-check"></i> Save</button>
        </div>
      </div>
    </div>
  `);
}

window.toggleForm = () => {
  const f = document.getElementById('add-form');
  if (f) f.style.display = f.style.display==='none' ? 'block' : 'none';
};

window.validateWalletInput = (el) => {
  const hint = el.parentElement.querySelector('.form-hint') || document.getElementById('s-wallet-hint');
  if (!hint) return;
  const v = el.value.trim();
  if (!v) { hint.textContent = '56-character Stellar public key starting with G'; hint.style.color=''; return; }
  if (isValidStellarAddress(v)) { hint.innerHTML='<span style="color:var(--success)"><i class="ti ti-check"></i> Valid Stellar address</span>'; }
  else { hint.innerHTML='<span style="color:var(--danger)"><i class="ti ti-alert-circle"></i> Must start with G and be 56 characters</span>'; }
};

window.addStudent = async () => {
  const name    = document.getElementById('s-name')?.value?.trim();
  const email   = document.getElementById('s-email')?.value?.trim();
  const password = document.getElementById('s-pass')?.value;
  const institution = document.getElementById('s-inst')?.value?.trim();
  const stellar_address = document.getElementById('s-stellar')?.value?.trim();
  if (!name || !email || !password) return showFlash('Name, email, and password required.', 'danger');
  try {
    await apiFetch('/students', { method:'POST', body:{ name, email, password, institution, stellar_address }});
    showFlash(`Student "${name}" added!`);
    await load();
  } catch(e) { showFlash(e.message, 'danger'); }
};

window.openWallet = (id, addr, name) => {
  document.getElementById('modal-id').value = id;
  document.getElementById('modal-addr').value = addr;
  document.getElementById('modal-name').textContent = name;
  document.getElementById('wallet-modal').style.display = 'flex';
};
window.closeWallet = () => { document.getElementById('wallet-modal').style.display = 'none'; };

window.saveWallet = async () => {
  const student_id = document.getElementById('modal-id')?.value;
  const stellar_address = document.getElementById('modal-addr')?.value?.trim();
  if (!isValidStellarAddress(stellar_address)) return showFlash('Invalid Stellar address.', 'danger');
  try {
    await apiFetch('/students', { method:'PATCH', body:{ student_id, stellar_address }});
    showFlash('Wallet updated!');
    closeWallet();
    await load();
  } catch(e) { showFlash(e.message, 'danger'); }
};

load();
</script>
</body>
</html>
