<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disburse — ScholarPay</title>
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh"><div class="spinner"></div></div></div>
<script type="module">
import { requireAdminPage, apiFetch, formatUSDC, txHashChip, stellarChip, showFlash } from '/assets/js/app.js';
import { pageShell } from '/assets/js/layout.js';

if (!requireAdminPage()) throw new Error('redirect');

const params = new URLSearchParams(location.search);
const preScholarshipId = params.get('scholarship_id') || '';
let scholarships = [], students = [], lastResult = null;

async function load() {
  [scholarships, students] = await Promise.all([
    apiFetch('/scholarships'),
    apiFetch('/students')
  ]);
  render();
}

function render() {
  const schOptions = scholarships
    .filter(s => s.status === 'active')
    .map(s => `<option value="${s.id}" data-remaining="${s.remaining_amount}" ${s.id==preScholarshipId?'selected':''}>
      ${s.name} (${formatUSDC(s.remaining_amount)} USDC left)</option>`).join('');

  const studOptions = students.map(s =>
    `<option value="${s.id}">${s.name} — ${s.email}</option>`).join('');

  const successBanner = lastResult ? `
    <div class="card" style="border-color:#bbf7d0;background:var(--success-bg);margin-bottom:24px">
      <div style="display:flex;align-items:flex-start;gap:14px">
        <div style="width:44px;height:44px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="ti ti-check" style="color:var(--success);font-size:22px"></i>
        </div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:15px;color:var(--success)">Disbursement confirmed on Stellar!</div>
          <div style="font-size:13.5px;color:var(--text-muted);margin-top:4px">
            <strong>${lastResult.amount_usdc?.toFixed(2)} USDC</strong> sent to
            <strong>${lastResult.student_name}</strong> for <em>${lastResult.purpose}</em>
          </div>
          <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:16px">
            <div><div style="font-size:11px;color:var(--text-hint);text-transform:uppercase;letter-spacing:.05em">Tx Hash</div>
              ${txHashChip(lastResult.stellar_tx_hash)}</div>
            <div><div style="font-size:11px;color:var(--text-hint);text-transform:uppercase;letter-spacing:.05em">Ledger</div>
              <span style="font-family:var(--mono);font-size:12px;color:var(--text-muted)">#${lastResult.ledger_sequence}</span></div>
            <div><div style="font-size:11px;color:var(--text-hint);text-transform:uppercase;letter-spacing:.05em">Wallet</div>
              ${stellarChip(lastResult.stellar_address,true)}</div>
          </div>
          <div style="margin-top:14px;display:flex;gap:8px">
            <a href="https://stellar.expert/explorer/testnet/tx/${lastResult.stellar_tx_hash}" target="_blank" class="btn btn-sm btn-outline">
              <i class="ti ti-external-link"></i> View on Stellar Explorer
            </a>
            <a href="/admin/audit" class="btn btn-sm btn-outline"><i class="ti ti-list-search"></i> Audit log</a>
          </div>
        </div>
      </div>
    </div>` : '';

  document.getElementById('app').innerHTML = pageShell('admin','disburse', `
    <div class="page-header">
      <h1 class="page-title">Disburse Scholarship</h1>
      <p class="page-subtitle">Send USDC directly to a student's Stellar wallet.</p>
    </div>
    ${successBanner}
    <div style="display:grid;grid-template-columns:1fr 360px;gap:20px">
      <div class="card">
        <div class="card-header"><span class="card-title"><i class="ti ti-send"></i> New Disbursement</span>
          <span class="stellar-badge"><i class="ti ti-bolt"></i> Stellar Testnet</span></div>
        ${scholarships.filter(s=>s.status==='active').length === 0
          ? `<div class="alert alert-warning"><i class="ti ti-alert-triangle"></i> No active scholarships. <a href="/admin/scholarships">Create one first.</a></div>`
          : students.length === 0
          ? `<div class="alert alert-warning"><i class="ti ti-alert-triangle"></i> No students with wallets. <a href="/admin/students">Add a student first.</a></div>`
          : `<div class="form-group">
              <label class="form-label">Scholarship <span class="required">*</span></label>
              <select id="d-scholarship" class="form-control" onchange="updateSchInfo(this)" required>
                <option value="">— Select scholarship —</option>${schOptions}
              </select>
              <div id="sch-info" style="display:none;margin-top:8px;padding:10px;background:var(--bg);border-radius:var(--radius);font-size:12.5px;color:var(--text-muted)">
                <i class="ti ti-info-circle"></i> Remaining: <strong id="sch-rem">—</strong> USDC of <strong id="sch-tot">—</strong> total
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Student <span class="required">*</span></label>
              <select id="d-student" class="form-control" required>
                <option value="">— Select student —</option>${studOptions}
              </select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Amount (USDC) <span class="required">*</span></label>
                <input type="number" id="d-amount" class="form-control" min="0.01" step="0.01" placeholder="e.g. 50.00" oninput="updateAmountPreview(this)">
                <div class="form-hint" id="amount-preview">Enter amount in USDC</div>
              </div>
              <div class="form-group">
                <label class="form-label">Purpose <span class="required">*</span></label>
                <select id="d-purpose" class="form-control" required>
                  <option value="">— Select purpose —</option>
                  <option value="tuition">Tuition</option>
                  <option value="housing">Housing / Accommodation</option>
                  <option value="books">Books & Materials</option>
                  <option value="technology">Technology / Laptop</option>
                  <option value="food">Food Allowance</option>
                  <option value="transport">Transport</option>
                  <option value="emergency">Emergency Grant</option>
                  <option value="research">Research Funding</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>
            <div class="alert alert-info" style="font-size:13px">
              <i class="ti ti-info-circle"></i>
              Calls <code style="background:var(--accent-dim);padding:1px 5px;border-radius:4px">disburse(scholarship_id, student_address, amount, purpose)</code> on the Soroban contract.
            </div>
            <div style="display:flex;gap:10px;margin-top:4px">
              <button id="d-btn" class="btn btn-primary btn-lg" onclick="doDisburse()">
                <i class="ti ti-send"></i> Disburse on Stellar
              </button>
              <a href="/admin/dashboard" class="btn btn-outline btn-lg">Cancel</a>
            </div>`}
      </div>
      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-title" style="margin-bottom:14px">How it works</div>
          ${[['ti-check','Validate','Scholarship is active and funded'],
             ['ti-bolt','Execute','Soroban token.transfer() on-chain'],
             ['ti-database','Record','Ledger seq + tx hash saved'],
             ['ti-wallet','Receive','Student balance increases in seconds']]
            .map(([ic,t,d])=>`<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
              <div style="width:28px;height:28px;background:var(--accent-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <i class="ti ${ic}" style="font-size:13px;color:var(--accent)"></i></div>
              <div><div style="font-weight:500;font-size:13px">${t}</div><div style="font-size:12px;color:var(--text-muted)">${d}</div></div>
            </div>`).join('')}
        </div>
        <div class="card">
          <div class="card-title" style="margin-bottom:10px">Stellar Specs</div>
          <table style="font-size:12.5px;width:100%">
            <tr><td style="color:var(--text-muted);padding:4px 0">Finality</td><td style="text-align:right;font-weight:500">3–5 seconds</td></tr>
            <tr><td style="color:var(--text-muted);padding:4px 0">Fee</td><td style="text-align:right;font-weight:500">~$0.0001</td></tr>
            <tr><td style="color:var(--text-muted);padding:4px 0">Token</td><td style="text-align:right"><span class="badge badge-info">USDC SEP-41</span></td></tr>
            <tr><td style="color:var(--text-muted);padding:4px 0">Network</td><td style="text-align:right"><span class="badge badge-warning">Testnet</span></td></tr>
          </table>
        </div>
      </div>
    </div>
  `);

  // Reinit if preselected
  const sel = document.getElementById('d-scholarship');
  if (sel && sel.value) updateSchInfo(sel);
}

window.updateSchInfo = (sel) => {
  const opt = sel.options[sel.selectedIndex];
  const info = document.getElementById('sch-info');
  if (!opt?.value) { info && (info.style.display='none'); return; }
  const rem = parseFloat(opt.dataset.remaining)/10000000;
  document.getElementById('sch-rem').textContent = rem.toFixed(2);
  info.style.display = 'block';
};

window.updateAmountPreview = (el) => {
  const p = document.getElementById('amount-preview');
  if (p) p.textContent = `= ${(parseFloat(el.value)||0).toFixed(2)} USDC on Stellar`;
};

window.doDisburse = async () => {
  const scholarship_id = document.getElementById('d-scholarship')?.value;
  const student_id     = document.getElementById('d-student')?.value;
  const amount_usdc    = document.getElementById('d-amount')?.value;
  const purpose        = document.getElementById('d-purpose')?.value;

  if (!scholarship_id || !student_id || !amount_usdc || !purpose)
    return showFlash('All fields are required.', 'danger');

  if (!confirm(`Confirm disbursement of ${parseFloat(amount_usdc).toFixed(2)} USDC on Stellar Testnet?`)) return;

  const btn = document.getElementById('d-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Processing on Stellar…';

  try {
    const result = await apiFetch('/disburse', { method:'POST', body:{ scholarship_id, student_id, amount_usdc, purpose }});
    lastResult = result.disbursement;
    showFlash(`Successfully disbursed ${amount_usdc} USDC!`);
    await load();
  } catch(e) {
    showFlash(e.message, 'danger');
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-send"></i> Disburse on Stellar';
  }
};

load();
</script>
</body>
</html>
