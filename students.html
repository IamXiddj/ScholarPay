<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholarships — ScholarPay</title>
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;height:100vh"><div class="spinner"></div></div></div>
<script type="module">
import { requireAdminPage, apiFetch, formatUSDC, formatDate, statusBadge, showFlash } from '/assets/js/app.js';
import { pageShell } from '/assets/js/layout.js';

if (!requireAdminPage()) throw new Error('redirect');

let scholarships = [];

async function load() {
  scholarships = await apiFetch('/scholarships');
  renderPage();
}

function renderPage(showForm = false) {
  const rows = scholarships.map(s => {
    const pct = s.total_amount > 0 ? Math.round(((s.total_amount - s.remaining_amount) / s.total_amount)*100) : 0;
    const toggle = s.status === 'active'
      ? `<button class="btn btn-sm btn-outline" onclick="toggleStatus(${s.id},'inactive')">Pause</button>`
      : `<button class="btn btn-sm btn-outline" onclick="toggleStatus(${s.id},'active')">Activate</button>`;
    return `<tr>
      <td><div style="font-weight:500">${s.name}</div>
        ${s.description ? `<div style="font-size:12px;color:var(--text-muted)">${s.description.slice(0,60)}…</div>` : ''}</td>
      <td style="font-weight:500">${formatUSDC(s.total_amount)}</td>
      <td>
        <div>${formatUSDC(s.remaining_amount)}</div>
        <div style="margin-top:4px;background:var(--bg);border-radius:4px;height:4px;width:80px;overflow:hidden">
          <div style="height:4px;background:var(--accent);border-radius:4px;width:${pct}%"></div>
        </div>
        <div style="font-size:11px;color:var(--text-hint)">${pct}% used</div>
      </td>
      <td>${statusBadge(s.status)}</td>
      <td style="font-size:12px;color:var(--text-muted)">${formatDate(s.created_at)}</td>
      <td>
        <div style="display:flex;gap:6px">
          <a href="/admin/disburse?scholarship_id=${s.id}" class="btn btn-sm btn-primary"><i class="ti ti-send"></i> Disburse</a>
          ${toggle}
        </div>
      </td>
    </tr>`;
  }).join('');

  const formHtml = `
  <div id="create-form" style="display:${showForm?'block':'none'};margin-bottom:24px">
    <div class="card">
      <div class="card-header"><span class="card-title">Create New Scholarship</span>
        <button class="btn btn-sm btn-outline" onclick="toggleForm()"><i class="ti ti-x"></i></button></div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Scholarship Name <span class="required">*</span></label>
          <input type="text" id="f-name" class="form-control" placeholder="e.g. STEM Global Grant 2025">
        </div>
        <div class="form-group">
          <label class="form-label">Total Amount (USDC) <span class="required">*</span></label>
          <input type="number" id="f-amount" class="form-control" placeholder="e.g. 500" min="1" step="0.01">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea id="f-desc" class="form-control" placeholder="Purpose of this scholarship fund…"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">USDC Token Contract Address</label>
        <input type="text" id="f-token" class="form-control mono" placeholder="CA2EY3LL6EI3ARMSRPSIUDG5K5YFS6T5367Z46OAP6FIHJFYDX5H6JUU">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-outline" onclick="toggleForm()">Cancel</button>
        <button class="btn btn-primary" onclick="createScholarship()"><i class="ti ti-check"></i> Create</button>
      </div>
    </div>
  </div>`;

  document.getElementById('app').innerHTML = pageShell('admin','scholarships', `
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end">
      <div><h1 class="page-title">Scholarships</h1><p class="page-subtitle">Manage scholarship grants and funding pools.</p></div>
      <button class="btn btn-primary" onclick="toggleForm()"><i class="ti ti-plus"></i> New Scholarship</button>
    </div>
    ${formHtml}
    <div class="card">
      <div class="card-header"><span class="card-title">All Scholarships (${scholarships.length})</span></div>
      ${scholarships.length === 0
        ? `<div class="empty-state"><div class="empty-icon"><i class="ti ti-award"></i></div><p>No scholarships yet.</p></div>`
        : `<div class="table-wrap"><table>
            <thead><tr><th>Name</th><th>Total (USDC)</th><th>Remaining</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
            <tbody>${rows}</tbody></table></div>`}
    </div>
  `);
}

window.toggleForm = () => {
  const f = document.getElementById('create-form');
  if (f) f.style.display = f.style.display === 'none' ? 'block' : 'none';
};

window.createScholarship = async () => {
  const name   = document.getElementById('f-name')?.value?.trim();
  const amount = document.getElementById('f-amount')?.value;
  const desc   = document.getElementById('f-desc')?.value?.trim();
  const token  = document.getElementById('f-token')?.value?.trim();
  if (!name || !amount) return showFlash('Name and amount are required.', 'danger');
  try {
    await apiFetch('/scholarships', { method:'POST', body:{ name, total_amount: amount, description: desc, token_address: token }});
    showFlash('Scholarship created!');
    await load();
  } catch(e) { showFlash(e.message, 'danger'); }
};

window.toggleStatus = async (id, status) => {
  try {
    await apiFetch('/scholarships', { method:'PATCH', body:{ id, status }});
    showFlash(`Status updated to ${status}.`);
    await load();
  } catch(e) { showFlash(e.message, 'danger'); }
};

load();
</script>
</body>
</html>
